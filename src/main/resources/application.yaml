server:
  port: 8080

spring:
  application:
    name: product

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_DB}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    baseline-on-migrate: true
    schemas: products

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: products

management:
  endpoints:
    web:
      base-path: /products/actuator
      exposure:
        include: ['prometheus']

logging:
  level:
    root: info
    store: debug
